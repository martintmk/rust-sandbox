# >>> anvil-managed: anvil-deny-advisories
[advisories]
yanked = "deny"
# Scope of unmaintained-crate checks: "all" surfaces transitive
# dependencies too; tighten to "workspace" if the noise is high.
unmaintained = "all"
# <<< anvil-managed: anvil-deny-advisories

# >>> anvil-managed: anvil-deny-licenses
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# <<< anvil-managed: anvil-deny-licenses

# Narrowly scoped, non-anvil license exception (placed outside the anvil-managed
# sentinel above so regeneration will not clobber it, while TOML still attaches
# it to the [licenses] table). `webpki-root-certs` (CDLA-Permissive-2.0) is a
# leaf transitive dependency of Microsoft's mandated `azure_devops_rust_api`
# reqwest transport (via rustls-platform-verifier) and cannot be dropped without
# abandoning the official Azure DevOps SDK. The exception is pinned to that one
# crate/license pair only.
exceptions = [
    { name = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

# >>> anvil-managed: anvil-deny-bans
[bans]
multiple-versions = "warn"
wildcards = "deny"
# <<< anvil-managed: anvil-deny-bans

# >>> anvil-managed: anvil-deny-sources
[sources]
unknown-registry = "deny"
unknown-git = "deny"
# <<< anvil-managed: anvil-deny-sources
