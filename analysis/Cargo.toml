[package]
name = "analysis"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pull request analysis through the GitHub Copilot SDK"
readme = "README.md"
keywords = ["analysis", "copilot", "pull-request"]
categories = ["development-tools"]

[features]
test-util = []

[dependencies]
async-trait = "0.1.89"
github-copilot-sdk = { version = "=1.0.13-preview.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
