[package]
name = "storage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SQLite data storage for pull request repositories and analyses"
readme = "README.md"
keywords = ["sqlite", "storage", "pull-request"]
categories = ["database"]

[dependencies]
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
tokio = { version = "1.53.1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }

[lints]
workspace = true
