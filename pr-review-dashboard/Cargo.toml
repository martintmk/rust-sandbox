[package]
name = "pr-review-dashboard"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local dashboard for reviewing pull requests"
readme = "README.md"
keywords = ["dashboard", "pull-request", "review"]
categories = ["development-tools"]

[dependencies]
anyspawn = { version = "0.7.0", default-features = false, features = ["tokio"] }
analysis = { path = "../analysis" }
bytes = "1.10.1"
fundle = "0.3.5"
futures-util = { version = "0.3.34", default-features = false }
http = "1.1.0"
http-body-util = "0.1.3"
hyper = { version = "1.11.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.20", default-features = false, features = [
    "http1",
    "server",
    "server-graceful",
    "service",
    "tokio",
] }
minijinja = { version = "2.12.0", default-features = false, features = [
    "builtins",
    "multi_template",
    "serde",
] }
ohno = "0.4.0"
providers = { path = "../providers" }
routerama = { version = "0.1.0", default-features = false, features = ["query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
storage = { path = "../storage" }
tempfile = "3.27.0"
tick = { version = "0.5.0", default-features = false, features = ["tokio"] }
time = { version = "0.3.55", default-features = false, features = ["formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = { version = "0.9.8", default-features = false, features = ["display", "parse", "serde", "std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
analysis = { path = "../analysis", features = ["test-util"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
# Enable tick's frozen test clock (`Clock::new_frozen*`) for deterministic tests.
tick = { version = "0.5.0", default-features = false, features = ["test-util"] }

[lints]
workspace = true
